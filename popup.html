<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>derStandard Comment Ranker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    /* v3.10.0: same look as the sort bar on the site — derStandard's blue
       article background, domed pills with a dark frame, a highlight line
       and a soft shadow; the active state is a bevelled coloured ring. */
    :root {
      --base: hsl(198 28% 88%);
      --track: color-mix(in srgb, var(--base) 65%, #fff);
      --track-border: color-mix(in srgb, var(--base) 75%, #000);
      --pill-bg: linear-gradient(to bottom,
        color-mix(in srgb, var(--track) 35%, #fff),
        var(--track) 55%,
        color-mix(in srgb, var(--track) 94%, #000));
      --pill-shadow: 0 0 0 1px var(--track-border),
        inset 0 1.5px 0 rgba(255, 255, 255, .95),
        inset 0 -2px 3px rgba(0, 0, 0, .08),
        0 3px 8px rgba(0, 0, 0, .18);
      --bevel: inset 0 2px 0 rgba(255, 255, 255, .6), inset 0 -2px 0 rgba(0, 0, 0, .35);
    }

    body {
      width: 340px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--base);
    }
    
    /* Basis für alle Badge-Pills */
    .badge-box {
      background: var(--pill-bg);
      border: 0;
      border-radius: 999px;
      box-shadow: var(--pill-shadow);
      padding: 0 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      transition: box-shadow .3s ease, background-color .3s ease;
      height: 50px;
      color: #333;
    }
    
    /* Box 1: Header mit Extension-Icon links */
    /* v3.10.1: the name is no button — plain header on the background,
       only clickable things are pills */
    .badge-box.header-badge {
      justify-content: flex-start;
      background: none;
      box-shadow: none;
      height: auto;
      padding: 2px 4px 4px;
      margin-bottom: 14px;
    }
    
    .header-text-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
    }
    
    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #333;
      white-space: nowrap;
      line-height: 1.2;
    }
    
    /* Box 2: On/off — v3.11.0: a two-segment track like the sort bar on the
       site. v3.21.0: same glass look as the sort bar (v3.20.0): the track
       glows red (Deaktiviert) or green (Aktiviert), the chosen segment is a
       raised glass knob reaching over the track's edge. */
    .onoff {
      position: relative;
      display: flex;
      gap: 3px;
      padding: 3px;
      height: 50px;
      margin: 14px 0 30px;
      border-radius: 999px;
      isolation: isolate;
    }
    .onoff::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: 999px;
      background: var(--pill-bg);
      box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), inset 0 -2px 3px rgba(0, 0, 0, .06), 0 0 0 1px var(--track-border), 0 0 0 2px rgba(198, 40, 40, .95), 0 -6px 9px 1px rgba(198, 40, 40, .55), 0 6px 9px 1px rgba(198, 40, 40, .55), 0 -11px 15px rgba(198, 40, 40, .35), 0 11px 15px rgba(198, 40, 40, .35);
      transition: box-shadow .3s ease;
    }
    .onoff.is-on::before { box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), inset 0 -2px 3px rgba(0, 0, 0, .06), 0 0 0 1px var(--track-border), 0 0 0 2px rgba(46, 125, 50, .95), 0 -6px 9px 1px rgba(46, 125, 50, .55), 0 6px 9px 1px rgba(46, 125, 50, .55), 0 -11px 15px rgba(46, 125, 50, .35), 0 11px 15px rgba(46, 125, 50, .35); }
    .onoff button {
      position: relative;
      flex: 1 1 0;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: rgba(51, 51, 51, .8);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .onoff button[aria-pressed="true"] { font-weight: 700; color: #222; }
    .onoff button:focus-visible { outline: 2px solid #333; outline-offset: 2px; border-radius: 999px; }
    .onoff-ico-off { color: #c62828; }
    .onoff-ico-on  { color: #2e7d32; }
    #onoffThumb {
      position: absolute;
      top: -1px;
      bottom: -1px;
      left: -1px;
      width: calc((100% - 9px) / 2 + 8px);
      border-radius: 999px;
      transform: translateX(calc(var(--i, 1) * (100% - 5px)));
      transition: transform .3s ease;
    }
    #onoffThumb::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 999px;
      background:
        radial-gradient(120% 90% at 30% 0%, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 55%),
        linear-gradient(to bottom, rgba(255, 255, 255, .97) 0%, rgba(250, 250, 252, .9) 50%, rgba(232, 236, 240, .92) 51%, rgba(255, 255, 255, .98) 100%);
      box-shadow: 0 0 0 2.5px rgba(40, 40, 40, .65), inset 0 0 0 1.5px #fff, inset 0 2px 0 #fff, inset 0 -2px 2px rgba(0, 0, 0, .1), 0 6px 16px rgba(0, 0, 0, .32), 0 2px 3px rgba(0, 0, 0, .4);
    }
    .onoff.no-anim #onoffThumb, .onoff.no-anim::before { transition: none; }
    /* click flash, as on the site: a short glow ring in the state's colour */
    @keyframes onoff-flash-on {
      0%   { box-shadow: 0 0 0 2.5px rgba(40, 40, 40, .65), inset 0 0 0 1.5px #fff, inset 0 2px 0 #fff, inset 0 -2px 2px rgba(0, 0, 0, .1), 0 6px 16px rgba(0, 0, 0, .32), 0 2px 3px rgba(0, 0, 0, .4), 0 0 0 10px rgba(46, 125, 50, .4); }
      100% { box-shadow: 0 0 0 2.5px rgba(40, 40, 40, .65), inset 0 0 0 1.5px #fff, inset 0 2px 0 #fff, inset 0 -2px 2px rgba(0, 0, 0, .1), 0 6px 16px rgba(0, 0, 0, .32), 0 2px 3px rgba(0, 0, 0, .4), 0 0 0 0 rgba(46, 125, 50, 0); }
    }
    @keyframes onoff-flash-off {
      0%   { box-shadow: 0 0 0 2.5px rgba(40, 40, 40, .65), inset 0 0 0 1.5px #fff, inset 0 2px 0 #fff, inset 0 -2px 2px rgba(0, 0, 0, .1), 0 6px 16px rgba(0, 0, 0, .32), 0 2px 3px rgba(0, 0, 0, .4), 0 0 0 10px rgba(198, 40, 40, .4); }
      100% { box-shadow: 0 0 0 2.5px rgba(40, 40, 40, .65), inset 0 0 0 1.5px #fff, inset 0 2px 0 #fff, inset 0 -2px 2px rgba(0, 0, 0, .1), 0 6px 16px rgba(0, 0, 0, .32), 0 2px 3px rgba(0, 0, 0, .4), 0 0 0 0 rgba(198, 40, 40, 0); }
    }
    .onoff.flash #onoffThumb::before { animation: onoff-flash-off .45s ease-out; }
    .onoff.is-on.flash #onoffThumb::before { animation: onoff-flash-on .45s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      #onoffThumb, .onoff::before { transition: none; }
      .onoff.flash #onoffThumb::before { animation: none; }
    }
    
    /* Box 3: Review/Bewerten-Badge (v2.0.5) */
    .review-badge {
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      position: relative; /* for tooltip + confirmation anchoring */
    }
    
    /* golden ring on the pill's edge, like the coffee button on the site */
    .review-badge:hover,
    .coffee-badge:hover,
    .coffee-badge.prompting {
      background: #fff8e1;
      box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), 0 0 0 2px rgba(230, 170, 0, .95), 0 -6px 9px 1px rgba(255, 200, 0, .55), 0 6px 9px 1px rgba(255, 200, 0, .55), 0 -11px 15px rgba(255, 200, 0, .35), 0 11px 15px rgba(255, 200, 0, .35);   /* v3.22.2: golden glow like the sort bar */
    }
    
    /* ═══ v2.0.6: Golden pulse — only active after 3 days of usage ═══ */
    /* Applied via JS by adding the .pulsing class. The pulse is a soft,
       breathing golden glow (same visual language as the coffee badge),
       paired with a gentle border-colour shift so it is eye-catching but
       never aggressive. Honours prefers-reduced-motion. */
    .review-badge.pulsing {
      background: #fff8e1;
      box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), 0 0 0 2px rgba(230, 170, 0, .95), 0 -6px 9px 1px rgba(255, 200, 0, .55), 0 6px 9px 1px rgba(255, 200, 0, .55), 0 -11px 15px rgba(255, 200, 0, .35), 0 11px 15px rgba(255, 200, 0, .35);
      animation: review-golden-pulse 2.4s ease-in-out infinite;
    }
    
    @keyframes review-golden-pulse {
      0%, 100% { box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), 0 0 0 2px rgba(230, 170, 0, .95), 0 -6px 9px 1px rgba(255, 200, 0, .55), 0 6px 9px 1px rgba(255, 200, 0, .55), 0 -11px 15px rgba(255, 200, 0, .35), 0 11px 15px rgba(255, 200, 0, .35); }
      50%      { box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), 0 0 0 2px rgba(230, 170, 0, .95), 0 -6px 9px 1px rgba(255, 200, 0, .25), 0 6px 9px 1px rgba(255, 200, 0, .25), 0 -11px 15px rgba(255, 200, 0, .12), 0 11px 15px rgba(255, 200, 0, .12); }
    }
    
    /* Pulsing star gets a soft glow + slow shimmer to draw the eye */
    .review-badge.pulsing .review-icon {
      animation: review-star-shimmer 2.4s ease-in-out infinite;
      text-shadow: 0 0 6px rgba(245, 197, 24, 0.6);
    }
    
    @keyframes review-star-shimmer {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.18); }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .review-badge.pulsing,
      .review-badge.pulsing .review-icon {
        animation: none;
      }
      /* keep a static highlight so the CTA is still noticeable */
      .review-badge.pulsing {
        box-shadow: inset 0 0 0 1px #f5c518, 0 0 0 1px #f5c518, 0 0 10px 2px rgba(255, 215, 0, 0.3);
      }
    }
    
    /* ═══ v2.0.6: "Danke!" confirmation after a click ═══ */
    .review-thanks {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #fff8e1;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #2e7d32;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.25s, transform 0.25s;
    }
    
    .review-badge.thanked .review-thanks {
      opacity: 1;
      transform: scale(1);
    }
    
    .review-icon {
      font-size: 18px;
      line-height: 1;
      color: #f5c518;
      flex-shrink: 0;
      transition: transform 0.3s;
    }
    
    .review-badge:hover .review-icon {
      transform: scale(1.15);
    }
    
    .review-text {
      font-size: 13px;
      font-weight: 600;
      color: #b8860b;
    }
    
    /* Box 4: Coffee mit goldenem Pulse + Dampf */
    .coffee-badge {
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      position: relative;
    }
    
    /* v3.23.0: golden glow always on, like the coffee button on the site;
       hovering gives one short golden flash, the reminder breathes */
    .coffee-badge { margin-top: 18px; box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), 0 0 0 2px rgba(230, 170, 0, .95), 0 -6px 9px 1px rgba(255, 200, 0, .55), 0 6px 9px 1px rgba(255, 200, 0, .55), 0 -11px 15px rgba(255, 200, 0, .35), 0 11px 15px rgba(255, 200, 0, .35); }
    .coffee-badge:hover { animation: coffee-hover-flash .45s ease-out; }
    .coffee-badge.prompting { animation: golden-pulse 1.5s ease-in-out infinite; }
    @keyframes coffee-hover-flash {
      0%   { background-color: #FFE27A; box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), 0 0 0 2px rgba(230, 170, 0, .95), 0 -6px 9px 1px rgba(255, 200, 0, .55), 0 6px 9px 1px rgba(255, 200, 0, .55), 0 -11px 15px rgba(255, 200, 0, .35), 0 11px 15px rgba(255, 200, 0, .35), 0 0 0 10px rgba(255, 200, 0, .45); }
      100% { background-color: #fff8e1; box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), 0 0 0 2px rgba(230, 170, 0, .95), 0 -6px 9px 1px rgba(255, 200, 0, .55), 0 6px 9px 1px rgba(255, 200, 0, .55), 0 -11px 15px rgba(255, 200, 0, .35), 0 11px 15px rgba(255, 200, 0, .35), 0 0 0 0 rgba(255, 200, 0, 0); }
    }
    
    @keyframes golden-pulse {
      0%, 100% { box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), 0 0 0 2px rgba(230, 170, 0, .95), 0 -6px 9px 1px rgba(255, 200, 0, .55), 0 6px 9px 1px rgba(255, 200, 0, .55), 0 -11px 15px rgba(255, 200, 0, .35), 0 11px 15px rgba(255, 200, 0, .35); }
      50%      { box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, .95), 0 0 0 2px rgba(230, 170, 0, .95), 0 -6px 9px 1px rgba(255, 200, 0, .25), 0 6px 9px 1px rgba(255, 200, 0, .25), 0 -11px 15px rgba(255, 200, 0, .12), 0 11px 15px rgba(255, 200, 0, .12); }
    }
    
    .coffee-badge:active {
      transform: translateY(0);
    }
    
    .coffee-text {
      font-size: 12px;
      color: #555;
      font-weight: 500;
      transition: color 0.3s;
    }
    
    .coffee-badge:hover .coffee-text,
    .coffee-badge.prompting .coffee-text {
      color: #B8860B;
    }
    
    /* v2.4.5: Auto-Puls alle 15 Tage — respektiert reduzierte Bewegung */
    @media (prefers-reduced-motion: reduce) {
      .coffee-badge:hover,
      .coffee-badge.prompting {
        animation: none;
      }
    }
    
    /* Coffee Icon Container — position: relative für Dampf */
    .coffee-icon-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }
    
    /* Coffee Icon — gleiche Größe wie Website-Badge (16px) */
    .coffee-icon {
      display: block;
      width: 20px;
      height: 20px;
      transition: transform 0.3s;
    }
    
    .coffee-badge:hover .coffee-icon,
    .coffee-badge.prompting .coffee-icon {
      transform: scale(1.1);
    }
    
    /* ═══ V14 Dampf-Animation ═══ */
    .steam-container {
      position: absolute;
      bottom: 60%;
      left: 40%;
      transform: translateX(-50%);
      width: 25px;
      height: 50px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease-out;
      overflow: visible;
    }
    
    .coffee-badge:hover .steam-container,
    .coffee-badge.prompting .steam-container {
      opacity: 1;
      transition: opacity 0.3s ease-in;
    }
    
    .steam-wisp {
      position: absolute;
      bottom: 0;
      width: 4px;
      height: 8px;
      background: linear-gradient(to top,
        rgba(140, 140, 140, 0.5) 0%,
        rgba(160, 160, 160, 0.35) 40%,
        rgba(180, 180, 180, 0.2) 100%
      );
      border-radius: 50% 50% 30% 30% / 40% 40% 60% 60%;
      filter: blur(2.5px);
      box-shadow: 0 0 2px rgba(120, 120, 120, 0.2);
      animation: steam-fine-rise 6s ease-out infinite;
    }
    
    .steam-wisp:nth-child(1) { left: 48%; animation-delay: 0s; width: 3px; height: 7px; }
    .steam-wisp:nth-child(2) { left: 50%; animation-delay: 0.2s; width: 4px; height: 8px; }
    .steam-wisp:nth-child(3) { left: 49%; animation-delay: 0.4s; width: 3.5px; height: 7.5px; }
    .steam-wisp:nth-child(4) { left: 51%; animation-delay: 0.6s; width: 3px; height: 7px; }
    .steam-wisp:nth-child(5) { left: 50%; animation-delay: 0.8s; width: 3.5px; height: 8px; }
    
    @keyframes steam-fine-rise {
      0%   { transform: translateY(0) translateX(0) rotate(0deg) scaleY(1); opacity: 0; }
      5%   { transform: translateY(-15px) translateX(0) rotate(2deg) scaleY(1.1); opacity: 0.7; }
      20%  { transform: translateY(-22px) translateX(1px) rotate(4deg) scaleY(1.3); opacity: 0.6; }
      40%  { transform: translateY(-30px) translateX(0) rotate(-3deg) scaleY(1.5); opacity: 0.5; }
      50%  { transform: translateY(-35px) translateX(-1px) rotate(-5deg) scaleY(1.6); opacity: 0.4; }
      60%  { transform: translateY(-40px) translateX(-1px) rotate(-4deg) scaleY(1.7); opacity: 0.25; }
      70%  { transform: translateY(-45px) translateX(0) rotate(-2deg) scaleY(1.8); opacity: 0.12; }
      80%  { transform: translateY(-49px) translateX(0) rotate(2deg) scaleY(1.85); opacity: 0.05; }
      90%  { transform: translateY(-51px) translateX(0) rotate(1deg) scaleY(1.88); opacity: 0.015; }
      100% { transform: translateY(-53px) translateX(0) rotate(0deg) scaleY(1.9); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Box 1: Extension-Icon links, Titel -->
  <div class="badge-box header-badge">
    <div class="header-text-container">
      <span class="header-title">derStandard Comment Ranker</span>
    </div>
  </div>
  
  <!-- Box 2: Ein/Aus — Schiene mit zwei Segmenten wie die Sortierleiste (v3.11.0) -->
  <div class="onoff is-on no-anim" id="onoff" role="group" aria-label="Extension">
    <div id="onoffThumb" aria-hidden="true"></div>
    <button type="button" id="btnOff" aria-pressed="false"><span class="onoff-ico-off">&#10005;</span> Deaktiviert</button>
    <button type="button" id="btnOn" aria-pressed="true"><span class="onoff-ico-on">&#10003;</span> Aktiviert</button>
  </div>
  
  <!-- Box 3: Review/Bewerten — Browser-aware Link (Chrome Web Store / Firefox AMO) -->
  <a class="badge-box review-badge" id="reviewBtn" href="#" target="_blank" rel="noopener">
    <span class="review-icon">&#9733;</span>
    <span class="review-text">Gefällt dir? Bewerte uns ★★★★★</span>
    <span class="review-thanks">&#10024; Danke!</span>
  </a>
  
  <!-- Box 4: Coffee mit goldenem Pulse + Dampf -->
  <div class="badge-box coffee-badge" id="donateBtn">
    <span class="coffee-text">Danke sagen</span>
    <span class="coffee-icon-container">
      <img class="coffee-icon" src="icons/coffee.svg" alt="">
      <span class="steam-container">
        <span class="steam-wisp"></span>
        <span class="steam-wisp"></span>
        <span class="steam-wisp"></span>
        <span class="steam-wisp"></span>
        <span class="steam-wisp"></span>
      </span>
    </span>
  </div>
</body>
<script src="popup.js"></script>
</html>
