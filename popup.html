<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>derStandard Comment Ranker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    /* v3.10.0: same look as the sort bar on the site — derStandard's blue
       article background, domed pills with a dark frame, a highlight line
       and a soft shadow. Green/red ring = state, golden ring = coffee. */
    :root {
      --base: hsl(198 28% 88%);
      --track: color-mix(in srgb, var(--base) 65%, #fff);
      --track-border: color-mix(in srgb, var(--base) 75%, #000);
      --pill-bg: linear-gradient(to bottom,
        color-mix(in srgb, var(--track) 35%, #fff),
        var(--track) 55%,
        color-mix(in srgb, var(--track) 94%, #000));
      --pill-shadow: 0 0 0 1px var(--track-border),
        inset 0 1.5px 0 rgba(255, 255, 255, .95),
        inset 0 -2px 3px rgba(0, 0, 0, .08),
        0 3px 8px rgba(0, 0, 0, .18);
      --gold-ring: inset 0 1.5px 0 rgba(255, 255, 255, .95), 0 0 0 2px rgba(230, 170, 0, .95), 0 2px 6px rgba(0, 0, 0, .12);
    }

    body {
      width: 340px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--base);
    }
    
    /* Basis für alle Badge-Pills */
    .badge-box {
      background: var(--pill-bg);
      border: 0;
      border-radius: 999px;
      box-shadow: var(--pill-shadow);
      padding: 0 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      transition: box-shadow .3s ease;
      height: 50px;
      color: #333;
    }
    
    /* Header: logo + title, centred. v3.10.1: the name is no button — plain
       header on the background, only clickable things are pills */
    .badge-box.header-badge {
      justify-content: center;   /* v4.8.0: centred */
      background: none;
      box-shadow: none;
      height: auto;
      padding: 2px 4px 4px;
      margin-bottom: 8px;
    }
    
    .header-text-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
    }
    
    /* v4.9.1: the logo left of the title */
    .header-logo {
      width: 28px;
      height: 28px;
      vertical-align: -8px;
      margin-right: 10px;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #333;
      white-space: nowrap;
      line-height: 1.2;
    }
    
    /* On/off: v4.8.0 — a pill button as switch: a green ring when on, a red
       ring when off. v4.10.0: only one switch left (on/off); its text says
       the current state ("ist an" / "ist aus"). */
    .toggles {
      display: flex;
      margin: 0 0 18px;
    }
    .toggle {
      flex: 1 1 0;
      height: 50px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      /* v4.10.2: the same ring as the active segment of the sort bar on the
         site — 3px, its colour seeping softly into a lightly tinted knob */
      background: linear-gradient(to bottom, #fdf1f0, #f8dcda);
      box-shadow: 0 0 0 3px rgba(198, 40, 40, .95), inset 0 0 9px 2px rgba(198, 40, 40, .3), 0 2px 6px rgba(0, 0, 0, .16), 0 1px 1.5px rgba(0, 0, 0, .12);
      transition: box-shadow .3s ease;
    }
    .toggle[aria-pressed="true"] {
      background: linear-gradient(to bottom, #f3faef, #e2f0da);
      box-shadow: 0 0 0 3px rgba(46, 125, 50, .95), inset 0 0 9px 2px rgba(46, 125, 50, .3), 0 2px 6px rgba(0, 0, 0, .16), 0 1px 1.5px rgba(0, 0, 0, .12);
    }
    .toggle:focus-visible { outline: none; }
    body.kbd .toggle:focus-visible { outline: 2px solid #333; outline-offset: 3px; }
    /* hidden until the saved state is read, so it never flashes the wrong one */
    .toggles.no-anim .toggle { transition: none; visibility: hidden; }
    @media (prefers-reduced-motion: reduce) {
      .toggle { transition: none; }
    }
    
    /* Review badge (store link, chosen per browser) */
    .review-badge {
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
    }
    
    /* golden ring on the pill's edge, like the coffee button on the site;
       v2.0.6: after 3 days of use the review badge shows it too (.pulsing) */
    .review-badge:hover,
    .review-badge.pulsing,
    .coffee-badge:hover,
    .coffee-badge.prompting {
      background: #fff8e1;
      box-shadow: var(--gold-ring);
    }
    /* v4.12.2: focus ring only after the keyboard was used (Safari focuses
       the first link when the popup opens, which drew a ring on "Bewerte uns") */
    body.kbd .badge-box:focus-visible { outline: 2px solid #333; outline-offset: 3px; }
    .badge-box:focus-visible { outline: none; }
    
    /* v4.10.3: no extra star in front — the five stars are the symbol
       (18px). Pulsing: a soft glow to draw the eye. v4.12.3: no scaling
       (on hover or pulsing) — it made the stars shift by a pixel */
    .review-badge.pulsing .review-stars {
      animation: review-star-shimmer 2.4s ease-in-out infinite;
    }
    
    @keyframes review-star-shimmer {
      0%, 100% { text-shadow: 0 0 2px rgba(245, 197, 24, 0); }
      50%      { text-shadow: 0 0 8px rgba(245, 197, 24, .8); }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .review-badge.pulsing .review-stars { animation: none; }
    }
    
    .review-stars {
      font-size: 18px;
      line-height: 1;
      color: #f5c518;
      flex-shrink: 0;
    }
    
    .review-text {
      font-size: 14px;
      font-weight: 600;
      color: #333;   /* v4.12.2: same text colour as the other buttons */
    }
    
    /* Coffee badge: golden ring always on, like the coffee button on the
       site; hovering gives one short golden flash and starts the steam. The
       reminder (.prompting, see popup.js) keeps the light background and the
       steam. */
    .coffee-badge {
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      margin-top: 18px;
      box-shadow: var(--gold-ring);
    }
    .coffee-badge:hover { animation: coffee-hover-flash .45s ease-out; }
    @keyframes coffee-hover-flash {
      0%   { background-color: #FFE27A; box-shadow: var(--gold-ring), 0 0 0 10px rgba(255, 200, 0, .45); }
      100% { background-color: #fff8e1; box-shadow: var(--gold-ring), 0 0 0 0 rgba(255, 200, 0, 0); }
    }
    
    .coffee-text {
      font-size: 14px;
      color: #333;
      font-weight: 600;
    }
    
    @media (prefers-reduced-motion: reduce) {
      .coffee-badge:hover, .steam-wisp { animation: none; }
    }
    
    /* Coffee Icon Container — position: relative für Dampf */
    .coffee-icon-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }
    
    /* Coffee icon — same size as on the site (20px) */
    .coffee-icon {
      display: block;
      width: 20px;
      height: 20px;
      transition: transform 0.3s;
    }
    
    .coffee-badge:hover .coffee-icon,
    .coffee-badge.prompting .coffee-icon {
      transform: scale(1.1);
    }
    
    /* steam above the cup */
    .steam-container {
      position: absolute;
      bottom: 60%;
      left: 40%;
      transform: translateX(-50%);
      width: 25px;
      height: 50px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease-out;
      overflow: visible;
    }
    
    .coffee-badge:hover .steam-container,
    .coffee-badge.prompting .steam-container {
      opacity: 1;
      transition: opacity 0.3s ease-in;
    }
    
    .steam-wisp {
      position: absolute;
      bottom: 0;
      width: 4px;
      height: 8px;
      background: linear-gradient(to top,
        rgba(140, 140, 140, 0.5) 0%,
        rgba(160, 160, 160, 0.35) 40%,
        rgba(180, 180, 180, 0.2) 100%
      );
      border-radius: 50% 50% 30% 30% / 40% 40% 60% 60%;
      filter: blur(2.5px);
      box-shadow: 0 0 2px rgba(120, 120, 120, 0.2);
      animation: steam-fine-rise 6s ease-out infinite;
    }
    
    .steam-wisp:nth-child(1) { left: 48%; animation-delay: 0s; width: 3px; height: 7px; }
    .steam-wisp:nth-child(2) { left: 50%; animation-delay: 0.2s; width: 4px; height: 8px; }
    .steam-wisp:nth-child(3) { left: 49%; animation-delay: 0.4s; width: 3.5px; height: 7.5px; }
    .steam-wisp:nth-child(4) { left: 51%; animation-delay: 0.6s; width: 3px; height: 7px; }
    .steam-wisp:nth-child(5) { left: 50%; animation-delay: 0.8s; width: 3.5px; height: 8px; }
    
    @keyframes steam-fine-rise {
      0%   { transform: translateY(0) translateX(0) rotate(0deg) scaleY(1); opacity: 0; }
      5%   { transform: translateY(-15px) translateX(0) rotate(2deg) scaleY(1.1); opacity: 0.7; }
      20%  { transform: translateY(-22px) translateX(1px) rotate(4deg) scaleY(1.3); opacity: 0.6; }
      40%  { transform: translateY(-30px) translateX(0) rotate(-3deg) scaleY(1.5); opacity: 0.5; }
      50%  { transform: translateY(-35px) translateX(-1px) rotate(-5deg) scaleY(1.6); opacity: 0.4; }
      60%  { transform: translateY(-40px) translateX(-1px) rotate(-4deg) scaleY(1.7); opacity: 0.25; }
      70%  { transform: translateY(-45px) translateX(0) rotate(-2deg) scaleY(1.8); opacity: 0.12; }
      80%  { transform: translateY(-49px) translateX(0) rotate(2deg) scaleY(1.85); opacity: 0.05; }
      90%  { transform: translateY(-51px) translateX(0) rotate(1deg) scaleY(1.88); opacity: 0.015; }
      100% { transform: translateY(-53px) translateX(0) rotate(0deg) scaleY(1.9); opacity: 0; }
    }

  </style>
</head>
<body>
  <!-- Header: logo + title -->
  <div class="badge-box header-badge">
    <div class="header-text-container">
      <span class="header-title"><img class="header-logo" src="icons/action64.png" alt="">derStandard Comment Ranker</span>
    </div>
  </div>
  
  <!-- On/off: v4.10.0 — one switch; the text and the ring show the current
       state (green ring = on, red ring = off) -->
  <div class="toggles no-anim">
    <button type="button" class="toggle" id="btnExt" aria-pressed="true" aria-label="Erweiterung" title="Klicken zum Ein- oder Ausschalten">Erweiterung ist an</button>
  </div>

  <!-- Review — store link per browser (Chrome Web Store / Firefox AMO) -->
  <a class="badge-box review-badge" id="reviewBtn" href="#" target="_blank" rel="noopener">
    <span class="review-text">Gefällt dir? Bewerte uns</span>
    <span class="review-stars" aria-hidden="true">★★★★★</span>
  </a>
  
  <!-- Coffee (donate) with steam -->
  <a class="badge-box coffee-badge" id="donateBtn" href="https://buymeacoffee.com/diversion" target="_blank" rel="noopener">
    <span class="coffee-text">Danke sagen</span>
    <span class="coffee-icon-container">
      <img class="coffee-icon" src="icons/coffee.svg" alt="">
      <span class="steam-container">
        <span class="steam-wisp"></span>
        <span class="steam-wisp"></span>
        <span class="steam-wisp"></span>
        <span class="steam-wisp"></span>
        <span class="steam-wisp"></span>
      </span>
    </span>
  </a>
  <script src="popup.js"></script>
</body>
</html>
