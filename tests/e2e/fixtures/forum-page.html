<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testartikel – derStandard (Fixture)</title>
<style>
  body { font: 14px sans-serif; margin: 0; }
  article { height: 400px; }
</style>
</head>
<body>
<article><h1>Testartikel</h1><p>Fixture page served for www.derstandard.at/story/… in E2E tests.</p></article>

<script>
// Minimal stand-in for derStandard's Lit forum (<dst-forum>), rendered
// asynchronously into an open shadow root, with native-like pagination and the
// model properties the extension's MAIN-world bridge (forum-hook.js) reads.
(function () {
  // Generated mode for scroll and performance tests:
  //   ?gen=N           N initial root postings with pseudo-random ratings
  //   &batches=B&size=S  B more batches of S postings via "Weitere Postings laden"
  //   &delay=MS        latency of one pagination round trip (default 150)
  //   &article=PX      height of the article above the forum (default 400)
  //   &moreAfter=MS    keep "Weitere Postings laden" disabled for the first MS
  //   &keepMore=1      keep the (disabled) button after the last batch instead of removing it
  //   &expanded=1      reply threads rendered open by derStandard (gear "Antworten ausgeklappt")
  //   &allReplies=1    every generated posting has 2 replies (default: every 7th)
  const params = new URLSearchParams(location.search);
  const LOAD_DELAY = Number(params.get('delay') || 150);
  if (params.has('article')) document.querySelector('article').style.height = params.get('article') + 'px';
  let seed = 42;
  const rnd = (max) => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed % max; };
  const gen = (from, count) => Array.from({ length: count }, (_, i) => {
    const n = from + i;
    return {
      id: 'G' + n, legacy: 50000 + n, pos: rnd(200), neg: rnd(80),
      time: new Date(Date.UTC(2026, 9, 28, 12) - n * 60000).toISOString(),
      replies: (params.has('allReplies') || n % 7 === 0) ? 2 : 0
    };
  });

  let INITIAL = [
    { id: 'E1', legacy: 9001, pos: 3, neg: 1, time: '2026-10-28T09:00:00Z' },
    { id: 'E2', legacy: 9002, pos: 40, neg: 5, time: '2026-10-28T08:00:00Z', replies: 2 },
    { id: 'E3', legacy: 9003, pos: 0, neg: 12, time: '2026-10-28T10:00:00Z' },
    { id: 'E4', legacy: 9004, pos: 12, neg: 0, time: '2026-10-27T10:00:00Z' }
  ];
  let BATCHES = [
    [{ id: 'E5', legacy: 9005, pos: 100, neg: 1, time: '2026-10-26T10:00:00Z' },
     { id: 'E6', legacy: 9006, pos: 1, neg: 30, time: '2026-10-28T11:00:00Z' }],
    [{ id: 'E7', legacy: 9007, pos: 7, neg: 7, time: '2026-10-25T10:00:00Z' }]
  ];
  if (params.has('gen')) {
    const n = Number(params.get('gen'));
    const size = Number(params.get('size') || 20);
    INITIAL = gen(0, n);
    BATCHES = Array.from({ length: Number(params.get('batches') || 0) }, (_, b) => gen(n + b * size, size));
  }
  const ALL = INITIAL.concat(...BATCHES);

  // "dd.mm.yyyy, HH:MM" in local time, like derStandard's <time data-date>.
  function dataDate(iso) {
    const d = new Date(iso);
    const z = (n) => String(n).padStart(2, '0');
    return z(d.getDate()) + '.' + z(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }

  // The thread section right after a posting (derStandard's structure).
  function threadOf(el) {
    const next = el.nextElementSibling;
    return next && next.tagName === 'SECTION' && next.classList.contains('thread') ? next : null;
  }

  function postingEl(p, level = 0) {
    const el = document.createElement('dst-posting');
    el.setAttribute('data-level', String(level));
    el.className = 'posting' + (p.replies ? ' posting-with-thread' : '');
    const r = document.createElement('dst-posting--ratinglog');
    r.setAttribute('postingid', p.id);
    r.setAttribute('positiveratings', String(p.pos));
    r.setAttribute('negativeratings', String(p.neg));
    r.textContent = '+' + p.pos + ' / -' + p.neg;
    // derStandard's own handler (paywall); the extension must win the click.
    r.addEventListener('click', () => { window.__paywallClicks = (window.__paywallClicks || 0) + 1; });
    const t = document.createElement('time');
    t.setAttribute('data-date', dataDate(p.time));
    t.textContent = dataDate(p.time);
    const body = document.createElement('p');
    body.textContent = 'Posting ' + p.id;
    el.append(r, ' ', t, body);

    const footer = document.createElement('dst-posting-footer');
    // "Antworten": derStandard puts its reply box into the thread right
    // after the posting (a new thread if there is none).
    const reply = document.createElement('button');
    reply.className = 'answer-button';
    reply.textContent = 'Antworten';
    reply.addEventListener('click', () => {
      let thread = threadOf(el);
      if (!thread) {
        thread = document.createElement('section');
        thread.className = 'thread';
        el.after(thread);
      }
      thread.classList.remove('collapsed');
      if (!thread.querySelector(':scope > dst-posting-box')) {
        const box = document.createElement('dst-posting-box');
        box.className = 'posting-new';
        box.textContent = 'Antwort schreiben …';
        thread.prepend(box);
      }
    });
    footer.appendChild(reply);
    if (p.replies) {
      // native toggle: open/close the thread
      const b = document.createElement('button');
      b.className = 'answers';
      const n = document.createElement('span');
      n.textContent = String(p.replies);
      b.appendChild(n);
      b.addEventListener('click', () => {
        el.classList.toggle('posting-has-thread-expanded');
        const thread = threadOf(el);
        if (thread) thread.classList.toggle('collapsed', !el.classList.contains('posting-has-thread-expanded'));
        window.__replyToggles = (window.__replyToggles || 0) + 1;
      });
      footer.appendChild(b);
    }
    el.appendChild(footer);
    return el;
  }

  class DstForum extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.forumModel = new Map();
      this.stickyPostingsModel = new Map();
      this.threadsByForumQuery = { data: { getForumRootPostingsV2: { pageInfo: { nextCursor: 'c0' } } } };
      this._totalPostingCount = ALL.length;
      this.isLoading = false;
      this.activeFilter = 0;
      this.sortField = 'ByTime';
      this.sortDirection = 'descending';
      this.isPermalink = false;
      this.isFolloweeTabChange = false;
      this.batches = BATCHES.slice();
    }
    hasMorePostings() { return this.batches.length > 0; }
    connectedCallback() {
      // Lit renders asynchronously.
      setTimeout(() => this.render(), 300);
    }
    addPostings(list) {
      for (const p of list) {
        const el = postingEl(p);
        this.main.appendChild(el);
        this.forumModel.set(p.id, p);
        if (p.replies) {
          // &expanded=1: derStandard renders threads open (gear setting)
          const open = params.has('expanded');
          if (open) el.classList.add('posting-has-thread-expanded');
          const s = document.createElement('section');
          s.className = 'thread' + (open ? '' : ' collapsed');
          for (let i = 0; i < p.replies; i++) {
            s.appendChild(postingEl({ id: p.id + '-r' + i, pos: 1, neg: 0, time: p.time }, 1));
          }
          this.main.appendChild(s);
        }
      }
    }
    render() {
      const style = document.createElement('style');
      style.textContent = ':focus-visible{outline:3px solid #000;outline-offset:2px}' + // derStandard's global ring
        'dst-posting{display:block;min-height:40px;border-bottom:1px solid #ccc}' +
        '.thread{display:block;padding-left:16px}.thread.collapsed{display:none}' +
        'dst-posting--ratinglog{cursor:pointer;font-weight:bold}';
      const header = document.createElement('header');
      header.className = 'forum--header';
      const count = document.createElement('span');
      count.className = 'forum--postingcount';
      count.textContent = ALL.length + ' Postings und Antworten';
      header.appendChild(count);
      this.main = document.createElement('main');
      this.main.className = 'forum--main';
      this.main.appendChild(document.createElement('dst-posting-box'));
      this.shadowRoot.append(style, header, this.main);
      this.addPostings(INITIAL);

      const more = document.createElement('button');
      more.className = 'thread--more';
      more.textContent = 'Weitere Postings laden';
      more.addEventListener('click', () => {
        window.__loadMoreClicks = (window.__loadMoreClicks || 0) + 1;
        this.isLoading = true;
        setTimeout(() => {
          this.addPostings(this.batches.shift() || []);
          this.threadsByForumQuery.data.getForumRootPostingsV2.pageInfo.nextCursor = 'c' + window.__loadMoreClicks;
          this.isLoading = false;
          if (!this.hasMorePostings()) {
            if (params.has('keepMore')) more.disabled = true;
            else more.remove();
          }
        }, LOAD_DELAY);
      });
      // moreAfter: the button is there but disabled at first (like while the
      // native forum is still busy), so the layout does not change.
      const moreAfter = Number(params.get('moreAfter') || 0);
      if (moreAfter) {
        more.disabled = true;
        setTimeout(() => { more.disabled = false; }, moreAfter);
      }
      this.shadowRoot.appendChild(more);
      // live: a decorative svg follows the forum inside the shadow root; it is
      // the first scroll-anchor candidate after main (overflow-anchor: none)
      const deco = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      deco.setAttribute('width', '40'); deco.setAttribute('height', '6');
      deco.style.display = 'block';
      this.shadowRoot.appendChild(deco);

      // The real forum loads its data via GraphQL; forum-hook.js listens to it.
      fetch('https://capi.ds.at/forum-serve-graphql', { method: 'POST', body: '{}' }).catch(() => {});
    }
  }
  customElements.define('dst-forum', DstForum);
  window.__FIXTURE_POSTINGS__ = ALL;
})();
</script>
<dst-forum></dst-forum>
<footer id="page-footer" style="height:1200px;background:#eee">Footer</footer>
</body>
</html>
